<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ARPlay Films</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-box">

            <div class="login-brand">
                <img
                    src="img/logo.png"
                    alt="ARPlay Films"
                    class="login-logo">

                <h1>ARPLAY <b>FILMS</b></h1>

                <p>Painel Administrativo</p>
            </div>

            <form id="loginForm" class="login-form">

                <h2>Fazer Login</h2>

                <div class="field">
                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required>
                </div>

                <div class="field">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn">
                    Entrar
                </button>

                <a
                    href="index.html"
                    class="voltar">
                    ← Voltar para o site
                </a>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
